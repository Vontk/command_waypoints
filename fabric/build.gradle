plugins {
    id 'net.fabricmc.fabric-loom'
    id 'maven-publish'
}

base { archivesName = "$rootProject.archives_name-fabric" }

repositories { maven { url "https://maven.terraformersmc.com/releases/" } }

dependencies {
    compileOnly "com.terraformersmc:modmenu:21.0.0"
    minecraft "net.minecraft:minecraft:$rootProject.minecraft_version"
    implementation "net.fabricmc:fabric-loader:$rootProject.fabric_loader_version"
    implementation "net.fabricmc.fabric-api:fabric-api:$rootProject.fabric_api_version"
}

sourceSets.main {
    java.srcDir '../common/src/main/java'
    resources.srcDir '../common/src/main/resources'
}

java {
    withSourcesJar()
    sourceCompatibility = JavaVersion.VERSION_25
    targetCompatibility = JavaVersion.VERSION_25
}
tasks.withType(JavaCompile).configureEach { options.release = 25 }

processResources {
    inputs.property 'version', project.version
    filesMatching('fabric.mod.json') { expand version: project.version }
}
jar { from(rootProject.file('LICENSE.txt')) }

publishing {
    publications {
        mavenJava(MavenPublication) {
            artifactId = base.archivesName.get()
            from components.java
        }
    }
}

sourceSets {
    coordinateChecks {
        java.srcDir 'src/coordinateTest/java'
        compileClasspath += sourceSets.main.output + sourceSets.main.compileClasspath
        runtimeClasspath += sourceSets.main.output + sourceSets.main.runtimeClasspath
    }
}

// These checks exercise the conversion math without launching Minecraft.
tasks.register('coordinateTest', JavaExec) {
    dependsOn coordinateChecksClasses
    classpath = sourceSets.coordinateChecks.runtimeClasspath
    mainClass = 'com.minenash.command_waypoints.WaypointCoordinatesTest'
}
check.dependsOn coordinateTest

// Minecraft serializes permissions using a CommandSourceStack with no server.
tasks.register('permissionTest', JavaExec) {
    dependsOn coordinateChecksClasses
    classpath = sourceSets.coordinateChecks.runtimeClasspath
    mainClass = 'com.minenash.command_waypoints.WaypointCommandPermissionsTest'
}
check.dependsOn permissionTest

// Opt-in real Minecraft integration harness, never included in the installed mod.
sourceSets {
    integrationChecks {
        java.srcDir 'src/integrationTest/java'
        resources.srcDir 'src/integrationTest/resources'
        compileClasspath += sourceSets.main.output + sourceSets.main.compileClasspath
        runtimeClasspath += sourceSets.main.output + sourceSets.main.runtimeClasspath
    }
}
tasks.register('integrationTestJar', Jar) {
    dependsOn integrationChecksClasses
    archiveBaseName = 'waypoint-integration-checks'
    from sourceSets.integrationChecks.output
}
